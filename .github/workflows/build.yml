name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Test core library
        run: dotnet test tests/SynapseMouse.Core.Tests/SynapseMouse.Core.Tests.csproj -c Release

      - name: Publish (win-x64, self-contained single file)
        run: >
          dotnet publish src/SynapseMouse.App/SynapseMouse.App.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish/win-x64

      - name: Runtime smoke test (launch the app, visit every page, toggle features)
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "synapse-self-test.txt"
          $p = Start-Process -FilePath "publish/win-x64/SynapseMouseAdjustments.exe" -ArgumentList "--self-test", $report -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "Self-test timed out" }
          if (Test-Path $report) { Get-Content $report } else { Write-Host "No report written." }
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit code $($p.ExitCode))" }

      - uses: actions/upload-artifact@v5
        with:
          name: SynapseMouseAdjustments-win-x64
          path: publish/win-x64
